<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You...</title>
    <style>
        body {
          background-color: #1a1a1a;
          color: white;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          margin: 0;
          text-align: center;
        }
        #messageBox {
          display: none;
          opacity: 0;
          transition: opacity 2s ease-in;
          padding: 20px;
        }
        button {
          padding: 15px 30px;
          font-size: 18px;
          border: none;
          border-radius: 25px;
          background-color: #ff4757;
          color: white;
          cursor: pointer;
          transition: transform 0.2s;
        }
        button:hover {
          transform: scale(1.05);
        }
        h1 { color: #ff4757; }
    </style>
</head>
<body>

<button id="startBtn">I have something to say. Click here.</button>

<div id="messageBox">
    <h1>I am so sorry.</h1>
    <p>I know I messed up, and I hate seeing you angry with me.</p>
    <p>You mean a lot to me. Can you find it in your heart to forgive me?</p>
</div>

<!-- Ensure your music file is in the same folder and named music.mp3 -->
<audio id="bgMusic" src="music.mp3" loop></audio>

<script>
    const btn = document.getElementById('startBtn');
    const messageBox = document.getElementById('messageBox');
    const music = document.getElementById('bgMusic');

    btn.addEventListener('click', () => {
      // Play the music
      music.play();

      // Hide button and fade in the message
      btn.style.display = 'none';
      messageBox.style.display = 'block';

      // Slight delay to allow display:block to apply before changing opacity for the fade effect
      setTimeout(() => {
        messageBox.style.opacity = '1';
      }, 100);
    });
</script>
</body>
</html>
